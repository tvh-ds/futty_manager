name: Local contracts and application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: scout
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U scout" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --frozen --extra dev --extra cloud --python 3.12
      - run: uv run ruff check src tests migrations databricks/jobs
      - run: uv run pytest -q --basetemp=.cache/pytest
      - name: PostgreSQL migrations and immutable publication
        env:
          SCOUT_DATABASE_URL: postgresql+psycopg://scout:ci-only-password@localhost/scout
        run: |
          uv run alembic upgrade head
          uv run scout demo
          uv run alembic check
      - run: uv run scout demo
      - run: cp frontend/openapi.json .cache/openapi.before.json
      - run: uv run scout openapi
      - run: cmp frontend/openapi.json .cache/openapi.before.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts
      - working-directory: frontend
        run: npm run generate:api && git diff --exit-code src/generated/api.ts
      - working-directory: frontend
        run: npm run build && npm test
      - working-directory: frontend
        run: npm audit --audit-level=moderate
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-verification
          path: |
            frontend/test-results
            frontend/dist
            artifacts/evaluation
          retention-days: 7
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform -chdir=infra/azure fmt -check -recursive
      - run: terraform -chdir=infra/azure init -backend=false -input=false
      - run: terraform -chdir=infra/azure validate
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --frozen --extra dev --extra lakehouse --python 3.12
      - run: uv run pytest tests/test_lakehouse.py -q --basetemp=.cache/pytest-spark
        env:
          SCOUT_TEST_SPARK: '1'
          SPARK_LOCAL_IP: 127.0.0.1
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8000/health/ready && curl --fail http://127.0.0.1:8080/api/datasets
      - if: always()
        run: docker compose logs --no-color && docker compose down
