name: Credit expiry guard
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  guard:
    if: vars.CLOUD_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: credit
        continue-on-error: true
        env:
          CREDIT_RECORD: ${{ vars.CREDIT_RECORD }}
        run: |
          python -c 'import os,pathlib; pathlib.Path("credit-record.json").write_text(os.environ["CREDIT_RECORD"])'
          python scripts/credit_guard.py credit-record.json
      - uses: azure/login@v2
        if: steps.credit.outcome == 'failure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Disable public API ingress when credit protection is unverified
        if: steps.credit.outcome == 'failure'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          az containerapp ingress disable -g "$RESOURCE_GROUP" -n "$APP" --output none
          echo 'Public ingress disabled; min replicas must remain zero. Storage/telemetry charges can remain.'
          exit 1
