name: Deploy configured Azure application
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  packages: write
concurrency:
  group: scout-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUD_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require passing CI for this commit before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PASSED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=completed" --jq '[.workflow_runs[] | select(.name == "Local contracts and application" and .conclusion == "success")] | length')
          test "$PASSED" -gt 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check portal-attested credit protection
        env:
          CREDIT_RECORD: ${{ vars.CREDIT_RECORD }}
        run: |
          python -c 'import os,pathlib; pathlib.Path("credit-record.json").write_text(os.environ["CREDIT_RECORD"])'
          python scripts/credit_guard.py credit-record.json
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Immutable API image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "API_IMAGE=ghcr.io/${REPOSITORY,,}/scout-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.API_IMAGE }}
      - name: Capture previous revision and deploy code
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          PREVIOUS=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" --query properties.template.containers[0].image -o tsv)
          echo "PREVIOUS_IMAGE=$PREVIOUS" >> "$GITHUB_ENV"
          az containerapp update -g "$RESOURCE_GROUP" -n "$APP" --image "$API_IMAGE" --output none
      - name: Readiness smoke test
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl --fail --retry 8 --retry-all-errors --retry-delay 10 --max-time 45 "$API_URL/health/ready"
      - name: Restore previous code on failed readiness
        if: failure() && env.PREVIOUS_IMAGE != ''
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINER_APP }}
        run: az containerapp update -g "$RESOURCE_GROUP" -n "$APP" --image "$PREVIOUS_IMAGE" --output none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: npm ci --ignore-scripts && npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
